name: Publish introduction (explicit dispatch only)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only public introduction files
        run: |
          mkdir public-page
          cp index.html CNAME .nojekyll public-page/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-page
      - uses: actions/deploy-pages@v4
        id: deployment
