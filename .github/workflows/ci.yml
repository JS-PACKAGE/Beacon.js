name: Cross-platform Node.js CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: Node.js ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/deployment.test.mjs
      - run: npm audit --omit=dev
